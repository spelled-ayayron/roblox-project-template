[package]
name = "herfave/roblox-project-template"
version = "0.1.0"
registry = "https://github.com/upliftgames/wally-index"
realm = "shared"

[place]
shared-packages = "game.ReplicatedStorage.Packages"

[dependencies]
# General purpose
Comm = "sleitnick/comm@1.0.1"
Signal = "sleitnick/signal@2.0.3"
Trove = "sleitnick/trove@1.5.1"
Promise = "evaera/promise@4.0.0"
Streamable = "sleitnick/streamable@1.2.4"
Timer = "sleitnick/timer@1.1.2"
EnumList = "sleitnick/enum-list@*"
Input = "sleitnick/input@^2.3.0"
Sift = "csqrl/sift@0.0.11"
ObjectCache = "pyseph/objectcache@1.4.4"
Iris = "sirmallard/iris@2.5.1"

# UI and animation
Fusion = "plainsour/lemon@0.4.0-dev.2.0"
Spring = "sleitnick/spring@1.0.0"

[server-dependencies]
ProfileStore = "lm-loleris/profilestore@1.0.3"
